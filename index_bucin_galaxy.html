.wrapper{width:100%;height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.slide{position:absolute;width:88%;max-width:390px;text-align:center;opacity:0;transform:translateX(120%);transition:.5s ease}
.slide.active{opacity:1;transform:translateX(0)}
.slide.prev{opacity:0;transform:translateX(-120%)}
.icon{width:145px;height:145px;margin:0 auto 28px;border:2px solid white;border-radius:25px;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;font-size:75px;box-shadow:0 0 25px rgba(255,255,255,.35);animation:float 3s infinite ease-in-out}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.box{border:2px solid white;border-radius:22px;background:rgba(0,0,0,.38);backdrop-filter:blur(8px);padding:22px 18px;min-height:120px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 25px rgba(255,255,255,.18)}
.text{font-size:20px;line-height:1.6;white-space:pre-line;text-shadow:0 0 8px black}
.long{text-align:left;font-size:15.5px;line-height:1.65;max-height:420px;overflow:auto}
.hint{margin-top:25px;font-size:14px;opacity:.85;text-shadow:0 0 8px black}
button{margin-top:22px;padding:13px 28px;border:none;border-radius:30px;background:white;color:#111;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 0 20px rgba(255,255,255,.6)}
.heart{position:fixed;top:-30px;font-size:24px;animation:fall 5s linear forwards;z-index:99}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg);opacity:0}}
.star{position:fixed;width:3px;height:3px;background:white;border-radius:50%;animation:twinkle 2s infinite;pointer-events:none;z-index:-1}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@media(max-width:420px){.icon{width:125px;height:125px;font-size:65px}.text{font-size:18px}.long{font-size:14.5px;max-height:390px}}
</style>
</head>
<body>
<div class="wrapper">
  <div class="slide active"><div class="icon">🐼</div><div class="box"><div class="text" data-text="haiii 👋"></div></div><div class="hint">klik dimana aja untuk lanjut ✨</div></div>
  <div class="slide"><div class="icon">🌙</div><div class="box"><div class="text" data-text="aku mau jujur sesuatu..."></div></div><div class="hint">klik dimana aja untuk lanjut ✨</div></div>
  <div class="slide"><div class="icon">🪐</div><div class="box"><div class="text" data-text="udah lama pengen bilang ini"></div></div><div class="hint">klik dimana aja untuk lanjut ✨</div></div>
  <div class="slide"><div class="icon">😭</div><div class="box"><div class="text" data-text="tapi selalu ga berani"></div></div><div class="hint">klik dimana aja untuk lanjut ✨</div></div>
  <div class="slide"><div class="icon">💌</div><div class="box"><div class="text" data-text="jadi aku tulis aja disini"></div></div><div class="hint">klik dimana aja untuk lanjut ✨</div></div>
  <div class="slide"><div class="icon">🤍</div><div class="box"><div class="text" data-text="baca sampai akhir yaa"></div></div><div class="hint">klik dimana aja untuk lanjut ✨</div></div>
  <div class="slide"><div class="icon">😠</div><div class="box"><div class="text" data-text="jangan di skip ya"></div></div><div class="hint">klik dimana aja untuk lanjut ✨</div></div>
  <div class="slide"><div class="icon">✨</div><div class="box"><div class="text" data-text="serius..."></div></div><div class="hint">klik dimana aja untuk lanjut ✨</div></div>
  <div class="slide"><div class="icon">🌌</div><div class="box"><div class="text long" data-text="Hai...

Aku sebenarnya orang yang cukup introvert dan jarang banget punya teman yang bisa diajak ngobrol lama.

Tapi selama 3 tahun ini, kamu jadi salah satu orang yang paling sering nemenin aku ngobrol.

Terima kasih ya, karena tanpa sadar kamu udah bikin hari-hariku jadi lebih berwarna.

Mungkin nanti kita nggak akan sering ketemu lagi seperti dulu.

Tapi kalau suatu saat kamu butuh teman cerita, lagi sedih, atau cuma ingin ngobrol, jangan ragu buat chat aku.

Thank you for being part of my story.

No matter how far life takes us,
I'll always be grateful that I met you. 🤍"></div></div><button onclick="loveRain()">💌 pencet ini</button></div>
</div>
<script>
for(let i=0;i<90;i++){const s=document.createElement("div");s.className="star";s.style.left=Math.random()*100+"vw";s.style.top=Math.random()*100+"vh";s.style.animationDelay=Math.random()*2+"s";document.body.appendChild(s);}
const slides=document.querySelectorAll(".slide");let index=0;let typing=false;
function typeText(el){const text=el.dataset.text;el.innerHTML="";let i=0;typing=true;const run=setInterval(()=>{el.innerHTML+=text.charAt(i);i++;if(i>=text.length){clearInterval(run);typing=false;}},35);}
typeText(document.querySelector(".slide.active .text"));
document.body.addEventListener("click",e=>{if(e.target.tagName==="BUTTON")return;if(typing)return;if(index>=slides.length-1)return;slides[index].classList.remove("active");slides[index].classList.add("prev");index++;slides[index].classList.add("active");typeText(slides[index].querySelector(".text"));});
function loveRain(){for(let i=0;i<55;i++){setTimeout(()=>{const heart=document.createElement("div");heart.className="heart";heart.innerHTML=["🤍","💗","❤️","✨"][Math.floor(Math.random()*4)];heart.style.left=Math.random()*100+"vw";heart.style.fontSize=(Math.random()*18+18)+"px";document.body.appendChild(heart);setTimeout(()=>heart.remove(),5000);},i*80);}}
</script>
</body>
</html>
